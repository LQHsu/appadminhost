<div class="bg-white rounded-lg shadow p-6">
  <h2 class="text-lg font-semibold text-slate-800 mb-4">Habitaciones</h2>

  <form [formGroup]="form" (ngSubmit)="crear()" class="flex flex-wrap items-end gap-3 mb-6">
    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">Piso</label>
      <input formControlName="piso" type="number" min="1" class="w-20 rounded border-slate-300" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">Número</label>
      <input formControlName="numero" type="text" class="w-24 rounded border-slate-300" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">Camas totales</label>
      <input formControlName="camasTotales" type="number" min="1" class="w-24 rounded border-slate-300" />
    </div>
    <button type="submit" class="px-4 py-2 rounded bg-sky-600 text-white text-sm font-medium hover:bg-sky-700">
      Agregar habitación
    </button>
  </form>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    @for (h of habitacionesService.habitaciones(); track h.id) {
      @if (editandoId() === h.id) {
        <div class="border rounded-lg p-3 col-span-2" [formGroup]="editForm">
          <div class="flex flex-wrap gap-2 mb-2">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Piso</label>
              <input formControlName="piso" type="number" min="1" class="w-16 rounded border-slate-300 text-sm" />
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Número</label>
              <input formControlName="numero" type="text" class="w-20 rounded border-slate-300 text-sm" />
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Camas</label>
              <input formControlName="camasTotales" type="number" min="1" class="w-20 rounded border-slate-300 text-sm" />
            </div>
          </div>
          @if (errorEdicion()) {
            <p class="text-xs text-red-600 mb-2">{{ errorEdicion() }}</p>
          }
          <div class="flex gap-2">
            <button
              type="button"
              (click)="guardarEdicion(h.id)"
              class="px-3 py-1 rounded bg-sky-600 text-white text-xs font-medium hover:bg-sky-700"
            >
              Guardar
            </button>
            <button
              type="button"
              (click)="cancelarEdicion()"
              class="px-3 py-1 rounded bg-slate-200 text-slate-700 text-xs font-medium hover:bg-slate-300"
            >
              Cancelar
            </button>
          </div>
        </div>
      } @else {
        <div class="border rounded-lg p-3 relative">
          <button
            type="button"
            (click)="editar(h)"
            class="absolute top-2 right-2 text-xs text-sky-600 hover:text-sky-800"
          >
            Editar
          </button>
          <p class="text-xs text-slate-500">Piso {{ h.piso }}</p>
          <p class="font-semibold text-slate-800">Hab. {{ h.numero }}</p>
          <p class="text-sm text-slate-500">{{ h.camasTotales }} camas</p>
        </div>
      }
    } @empty {
      <p class="text-slate-500 text-sm col-span-full">Aún no hay habitaciones. Agrega la primera arriba.</p>
    }
  </div>
</div>
